name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yos
          POSTGRES_PASSWORD: yos
          POSTGRES_DB: yos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yos:yos@localhost:5432/yos_test
      DATABASE_URL: postgres://yos:yos@localhost:5432/yos_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and import boundaries
        run: npm run lint
      - name: Tests (PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run bundle:check
